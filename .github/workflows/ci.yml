name: CI

on:
  push:
  pull_request:
  # Weekly as well, so govulncheck sees new advisories without a push.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: connector
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go vet -tags e2e ./e2e
      - name: go vet (darwin/arm64, cgo off)
        if: runner.os == 'Linux'
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...
      # Guards against licenses below a module's root, like xxhash's in klauspost/compress,
      # going missing from the notices. Same tags as scripts/release-connector.sh.
      - name: third-party notices
        if: runner.os == 'Linux'
        run: ../scripts/third-party-notices.sh . -tags ts_omit_webclient | grep -F 'Copyright (c) 2016 Caleb Spare'
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      # The race detector needs cgo and a C compiler, which this runner doesn't promise.
      - name: go test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # go run with GOOS set would build govulncheck for darwin, so it's installed first.
      - name: govulncheck (darwin/arm64, cgo off)
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 "$(go env GOPATH)/bin/govulncheck" ./...

  # The install scripts, as a user runs them: install, a crash and restart, reinstall,
  # uninstall, uninstall --purge. On Windows the script builds from source. A reinstall
  # drops an update's trial and the binary it would roll back to, and an uninstall the
  # updater's binaries, and both keep the updater's state. Then the updater end to end,
  # on macOS too, which also dry-runs the release scripts.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    # The updates take about 20 minutes, and up to 35 when each night comes late. A
    # rollback on Windows waits up to a minute for each of three starts.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # A user systemd that keeps running, as on a server with linger.
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 30); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
          # Not grep -q: it can exit before status finishes writing, and pipefail fails the
          # step on status's SIGPIPE (exit 141).
          running() { ~/.local/state/ovenlight/bin/ovenlight status | grep '^Connector: running' > /dev/null; }
          s=~/.local/state/ovenlight
          connector/install.sh
          sleep 3 && running
          systemctl --user show -p ExecStart ovenlight | grep ' run --service ' > /dev/null
          kill -9 "$(systemctl --user show -p MainPID --value ovenlight)"
          sleep 15 && running
          echo '{}' > "$s/update.json"
          touch "$s/update-trial.json" "$s/bin/ovenlight.prev"
          connector/install.sh
          sleep 3 && running
          for f in "$s/update-trial.json" "$s/bin/ovenlight.prev"; do test ! -e "$f"; done
          touch "$s/updates-off" "$s/update-trial.json" "$s/bin/ovenlight.prev" "$s/bin/ovenlight.next" "$s/bin/ovenlight.download"
          connector/uninstall.sh
          for f in update-trial.json bin/ovenlight bin/ovenlight.prev bin/ovenlight.next bin/ovenlight.download; do test ! -e "$s/$f"; done
          for f in update.json updates-off; do test -e "$s/$f"; done
          connector/uninstall.sh --purge
          test ! -e ~/.local/state/ovenlight
          ! systemctl --user is-active ovenlight
      - name: Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $o = "$env:LOCALAPPDATA\ovenlight\bin\ovenlight.exe"
          function Check($ok, $what) { if (-not $ok) { throw $what } }
          function Running { [bool](& $o status | Select-String '^Connector: running') }
          $s = "$env:LOCALAPPDATA\ovenlight"
          $prev = "$s\bin\ovenlight.prev.exe"
          powershell -ExecutionPolicy Bypass -File connector\install.ps1
          Check ($LASTEXITCODE -eq 0) 'install failed'
          Check (Running) 'not running after install'
          Check ((Get-ScheduledTask ovenlight).Actions[0].Arguments -like '*run --service *') 'task runs without --service'
          Stop-Process -Name ovenlight -Force
          for ($i = 0; $i -lt 45 -and -not (Running); $i++) { Start-Sleep 2 }
          Check (Running) 'not restarted within 90 s'
          # A .prev still running, as an older MCP server may, which only a rename moves. With
          # no apps, this connector contacts nothing.
          Set-Content "$s\update.json" '{}'
          Set-Content "$s\update-trial.json" '{}'
          Copy-Item $o $prev
          $p = Start-Process $prev -ArgumentList 'run', '--config', "$env:RUNNER_TEMP\c.json", '--state', "$env:RUNNER_TEMP\s" -WindowStyle Hidden -PassThru
          powershell -ExecutionPolicy Bypass -File connector\install.ps1
          Check ($LASTEXITCODE -eq 0) 'reinstall failed'
          Check (Running) 'not running after reinstall'
          Check (-not (Test-Path "$s\update-trial.json")) 'trial left behind'
          Check (-not (Test-Path $prev)) '.prev left in place'
          # .prev and the replaced binary, each aside under its own name.
          Check ((Get-ChildItem "$s\bin" -Filter 'ovenlight.old-*.exe').Count -eq 2) '.prev not moved aside'
          Stop-Process -Id $p.Id -Force
          $p.WaitForExit()
          Set-Content "$s\updates-off" ''
          foreach ($f in 'update-trial.json', 'bin\ovenlight.prev.exe', 'bin\ovenlight.next.exe', 'bin\ovenlight.download') { Set-Content "$s\$f" '' }
          powershell -ExecutionPolicy Bypass -File connector\uninstall.ps1
          Check ($LASTEXITCODE -eq 0) 'uninstall failed'
          foreach ($f in 'update-trial.json', 'bin\ovenlight.exe', 'bin\ovenlight.prev.exe', 'bin\ovenlight.next.exe', 'bin\ovenlight.download') { Check (-not (Test-Path "$s\$f")) "$f left behind" }
          Check (-not (Get-ChildItem "$s\bin" -Filter 'ovenlight.old*.exe')) 'old binaries left behind'
          foreach ($f in 'update.json', 'updates-off') { Check (Test-Path "$s\$f") "$f removed" }
          powershell -ExecutionPolicy Bypass -File connector\uninstall.ps1 --purge
          Check ($LASTEXITCODE -eq 0) 'uninstall failed'
          Check (-not (Get-ScheduledTask ovenlight -ErrorAction SilentlyContinue)) 'task left behind'
          Check (-not (Test-Path "$env:LOCALAPPDATA\ovenlight")) 'folder left behind'
      # The release scripts' dry runs, with the BSD sed and date of the Macs that release.
      - name: Release scripts
        if: runner.os == 'macOS'
        run: scripts/test-connector-release.sh
      # The connector is a launchd agent of the login session, so this runner can run it
      # only if it has one.
      - name: launchd's user domain
        if: runner.os == 'macOS'
        run: launchctl print "gui/$(id -u)" > /dev/null
      # Test releases installed with their own install script, updating from a local server
      # on a 5-second hour: two updates in a row through the daily check, the wait and the
      # night, an older release's install script, and a rollback from a release that
      # crashes at start (connector/e2e/update_test.go).
      - name: Updates
        working-directory: connector
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export XDG_RUNTIME_DIR
          fi
          OVENLIGHT_E2E_UPDATE=1 go test -tags e2e ./e2e -run TestUpdate -v -count=1 -timeout 55m

  e2e:
    runs-on: ubuntu-24.04
    # More than the test's own -timeout, so that one reports where it hung.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - run: go install github.com/juanfont/headscale/cmd/headscale@v0.29.4
      - run: OVENLIGHT_E2E_HEADSCALE="$(go env GOPATH)/bin/headscale" go test -tags e2e ./e2e -v -count=1 -timeout 15m

  # The Android app: its Go core's checks, lint, unit tests, the debug build, and the
  # release bundle with the checks Play and the plan ask of it (scripts/verify-bundle.sh).
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@v7
        with:
          go-version-file: android/core/go.mod
          cache-dependency-path: android/core/go.sum
      # The iPhone tests are the spec: each needs an Android twin of the same name.
      - name: Test parity with the iPhone app
        run: scripts/test-parity.sh
      - name: Gradle wrapper
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c
      # One NDK pin, read from gradle.properties as Gradle and the core's build read it.
      - name: SDK packages (no-ops when the image has them)
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(sed -n 's/^ovenlight.ndkVersion=//p' gradle.properties)" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Go core
        working-directory: android/core
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go vet ./...
          go test -race -count=1 ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Lint, unit tests, and the debug build and release bundle
        run: ./gradlew --no-daemon :app:lintDebug :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - name: Release bundle
        run: scripts/verify-bundle.sh app/build/outputs/bundle/release/app-release.aab
      - name: Third-party notices
        run: grep -q "^tailscale.com $(cd core && go list -m -f '{{.Version}}' tailscale.com)\$" app/libs/THIRD_PARTY_NOTICES.txt

  # The app's instrumented tests on an emulator: WebView, the proxy, profiles, the lock and every
  # screen's accessibility checks. On pushes to android until it merges, since GitHub runs
  # schedules only on the default branch, then weekly. API 36: on 37 Espresso 3.7.0 can't start
  # (Android 17 removed the InputManager method it reflects on). 36's image has WebView M133,
  # below Ovenlight's M144 floor, so it gets Google's own WebView from 37's image, as avds.sh
  # gives the mini's AVDs.
  android-emulator:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/android') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@v7
        with:
          go-version-file: android/core/go.mod
          cache-dependency-path: android/core/go.sum
      - name: Gradle wrapper
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c
      - name: SDK packages and the emulators (no-ops when the image has them)
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(sed -n 's/^ovenlight.ndkVersion=//p' gradle.properties)" "platforms;android-37.0" "build-tools;36.0.0" \
            emulator "system-images;android-36;google_apis;x86_64" "system-images;android-37.0;google_apis;x86_64" > /dev/null
      # Google's WebView from the API 37 image, kept until that image changes, so the webview
      # emulator boots only when it does.
      - id: image
        run: echo "revision=$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/system-images/android-37.0/google_apis/x86_64/source.properties")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/webview
          key: webview-${{ steps.image.outputs.revision }}
      # The release set of ABIs, which debug builds take too: the runner's emulator is x86_64.
      - name: Core library
        run: ../scripts/build-android-core.sh
      - name: The app and its tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      # Made fresh on the runner (the fixed AVD set is the mini's), one at a time and only once the
      # build is done: an emulator booting beside the build or another emulator is starved, its
      # System UI stops responding, and the tests' keys land on the ANR dialog and close System UI.
      # webview on 5556 boots only to hand over its WebView, then ci on 5554 for the tests, set up
      # as the mini's AVDs are (avds.sh): WebView M144 or later, no animations, the PIN 1111, awake
      # and unlocked, since a phone on its lock screen keeps every app from resuming.
      - name: Emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # avdmanager and the emulator look for AVDs in different places by default.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          adb="$ANDROID_HOME/platform-tools/adb"
          # One adb server for the run, rather than one the emulator starts.
          "$adb" start-server
          # The runner's avdmanager has no pixel_9; pixel_7 has the same 412 by 915 dp screen.
          boot() { # name api port flags...
            name=$1 api=$2 port=$3
            shift 3
            echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n "$name" -k "system-images;$api;google_apis;x86_64" -d pixel_7 -p "$ANDROID_AVD_HOME/$name.avd"
            # SwiftShader through ANGLE: the runner's GLES translator over SwiftShader
            # (swiftshader_indirect, as on the mini) crashes the emulator drawing WebView's
            # color picker. The subshell logs how the emulator ended.
            (nohup "$ANDROID_HOME/emulator/emulator" -avd "$name" -port "$port" "$@" -no-window -no-audio -no-boot-anim -no-metrics -gpu swangle_indirect -no-snapshot; echo "emulator exited with $?") > "$RUNNER_TEMP/$name.log" 2>&1 &
            timeout 600 sh -c "until [ \"\$('$adb' -s emulator-$port shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')\" = 1 ]; do sleep 2; done" ||
              { tail -50 "$RUNNER_TEMP/$name.log"; exit 1; }
          }
          webview() { "$adb" -s emulator-5554 shell dumpsys webviewupdate | sed -n 's/.*Current WebView package (name, version): ([^,]*, \([0-9]*\)\..*/\1/p' | head -1; }
          if [ ! -f ~/webview/webview.apk ]; then
            boot webview android-37.0 5556
            # The package manager may still be starting when the boot is reported complete.
            apk=
            for _ in $(seq 30); do
              apk="$("$adb" -s emulator-5556 shell pm path com.google.android.webview 2> /dev/null | tr -d '\r' | sed -n 's/^package://p' | head -1)"
              [ -n "$apk" ] && break
              sleep 2
            done
            [ -n "$apk" ] || { echo "the webview emulator has no WebView package"; exit 1; }
            mkdir -p ~/webview
            "$adb" -s emulator-5556 pull "$apk" ~/webview/webview.apk
            "$adb" -s emulator-5556 emu kill
          fi
          # ci gets 4 GB, as the mini's AVDs: the web view pool keeps as many pages as it does there.
          boot ci android-36 5554 -memory 4096
          # The package manager may still be settling just after boot.
          for _ in 1 2 3 4 5 6; do "$adb" -s emulator-5554 install -r ~/webview/webview.apk && break; sleep 3; done
          for _ in $(seq 30); do [ "$(webview)" -ge 144 ] 2> /dev/null && break; sleep 2; done
          [ "$(webview)" -ge 144 ] 2> /dev/null || { echo "WebView M$(webview)"; exit 1; }
          for k in window_animation_scale transition_animation_scale animator_duration_scale; do "$adb" -s emulator-5554 shell settings put global $k 0; done
          "$adb" -s emulator-5554 shell locksettings set-pin 1111
          "$adb" -s emulator-5554 shell svc power stayon true
          "$adb" -s emulator-5554 shell settings put system screen_off_timeout 2147483647
          # grep -c reads to the end: an early exit would fail the pipe under pipefail.
          locked() { [ "$("$adb" -s emulator-5554 shell dumpsys window policy | grep -A1 KeyguardStateMonitor | grep -c 'mIsShowing=true')" != 0 ]; }
          "$adb" -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          for _ in 1 2 3 4 5; do
            locked || break
            "$adb" -s emulator-5554 shell wm dismiss-keyguard || true
            sleep 1
            "$adb" -s emulator-5554 shell input text 1111
            "$adb" -s emulator-5554 shell input keyevent 66
            sleep 2
          done
          ! locked || { echo "the emulator stayed on its lock screen"; exit 1; }
          # Room for the whole run's logcat, which a failed run keeps.
          "$adb" -s emulator-5554 logcat -G 16M
      - name: Instrumented tests
        run: ANDROID_SERIAL=emulator-5554 ./gradlew --no-daemon :app:connectedDebugAndroidTest
      # Whether the runner ran out of memory or the emulator stopped on its own, and the
      # emulator's whole log and the ANRs and crashes it kept.
      - if: failure()
        run: |
          free -m
          ps -eo pid,rss,etime,args --sort=-rss | head -8 | cut -c1-200
          sudo dmesg | grep -i -E "oom|killed process|out of memory|segfault" | tail -10 || true
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" devices
          # timeout: adb waits for a device that's gone.
          timeout 60 "$adb" -s emulator-5554 logcat -b all -d > "$RUNNER_TEMP/logcat.log" || true
          timeout 60 "$adb" -s emulator-5554 shell dumpsys dropbox --print > "$RUNNER_TEMP/dropbox.log" || true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-reports
          # The report, each test's logcat and failure, and the emulators' own logs.
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
            ${{ runner.temp }}/*.log

  # The docs as the site renders them: a link or #anchor in docs/ that goes nowhere fails,
  # as does a security.txt within a month of expiring.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts/sitedocs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: scripts/sitedocs/go.mod
          cache-dependency-path: scripts/sitedocs/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go run .
