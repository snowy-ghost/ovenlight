name: CI

on:
  push:
  pull_request:
  # Weekly as well, so govulncheck sees new advisories without a push.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: connector
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go vet -tags e2e ./e2e
      - name: go vet (darwin/arm64, cgo off)
        if: runner.os == 'Linux'
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...
      # Guards against licenses below a module's root, like xxhash's in klauspost/compress,
      # going missing from the notices. Same tags as scripts/release-connector.sh.
      - name: third-party notices
        if: runner.os == 'Linux'
        run: ../scripts/third-party-notices.sh . -tags ts_omit_webclient | grep -F 'Copyright (c) 2016 Caleb Spare'
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      # The race detector needs cgo and a C compiler, which this runner doesn't promise.
      - name: go test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # go run with GOOS set would build govulncheck for darwin, so it's installed first.
      - name: govulncheck (darwin/arm64, cgo off)
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 "$(go env GOPATH)/bin/govulncheck" ./...

  # The install scripts, as a user runs them: install, a crash and restart, reinstall,
  # uninstall --purge. On Windows the script builds from source.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # A user systemd that keeps running, as on a server with linger.
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 30); do systemctl --user show-environment >/dev/null 2>&1 && break; sleep 1; done
          # Not grep -q: it can exit before status finishes writing, and pipefail fails the
          # step on status's SIGPIPE (exit 141).
          running() { ~/.local/state/ovenlight/bin/ovenlight status | grep '^Connector: running' > /dev/null; }
          connector/install.sh
          sleep 3 && running
          kill -9 "$(systemctl --user show -p MainPID --value ovenlight)"
          sleep 15 && running
          connector/install.sh
          sleep 3 && running
          connector/uninstall.sh --purge
          test ! -e ~/.local/state/ovenlight
          ! systemctl --user is-active ovenlight
      - name: Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $o = "$env:LOCALAPPDATA\ovenlight\bin\ovenlight.exe"
          function Check($ok, $what) { if (-not $ok) { throw $what } }
          function Running { [bool](& $o status | Select-String '^Connector: running') }
          powershell -ExecutionPolicy Bypass -File connector\install.ps1
          Check ($LASTEXITCODE -eq 0) 'install failed'
          Check (Running) 'not running after install'
          Stop-Process -Name ovenlight -Force
          for ($i = 0; $i -lt 45 -and -not (Running); $i++) { Start-Sleep 2 }
          Check (Running) 'not restarted within 90 s'
          powershell -ExecutionPolicy Bypass -File connector\install.ps1
          Check ($LASTEXITCODE -eq 0) 'reinstall failed'
          powershell -ExecutionPolicy Bypass -File connector\uninstall.ps1 --purge
          Check ($LASTEXITCODE -eq 0) 'uninstall failed'
          Check (-not (Get-ScheduledTask ovenlight -ErrorAction SilentlyContinue)) 'task left behind'
          Check (-not (Test-Path "$env:LOCALAPPDATA\ovenlight")) 'folder left behind'

  e2e:
    runs-on: ubuntu-24.04
    # More than the test's own -timeout, so that one reports where it hung.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - run: go install github.com/juanfont/headscale/cmd/headscale@v0.29.4
      - run: OVENLIGHT_E2E_HEADSCALE="$(go env GOPATH)/bin/headscale" go test -tags e2e ./e2e -v -count=1 -timeout 15m

  # The Android app: its Go core's checks, lint, unit tests, the debug build, and the
  # release bundle with the checks Play and the plan ask of it (scripts/verify-bundle.sh).
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@v7
        with:
          go-version-file: android/core/go.mod
          cache-dependency-path: android/core/go.sum
      # The iPhone tests are the spec: each needs an Android twin of the same name.
      - name: Test parity with the iPhone app
        run: |
          git fetch --no-tags --depth=1 origin app-1.0.2:refs/remotes/origin/app-1.0.2
          scripts/test-parity.sh
      - name: Gradle wrapper
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c
      # One NDK pin, read from gradle.properties as Gradle and the core's build read it.
      - name: SDK packages (no-ops when the image has them)
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(sed -n 's/^ovenlight.ndkVersion=//p' gradle.properties)" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Go core
        working-directory: android/core
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go vet ./...
          go test -race -count=1 ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Lint, unit tests, and the debug build and release bundle
        run: ./gradlew --no-daemon :app:lintDebug :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - name: Release bundle
        run: scripts/verify-bundle.sh app/build/outputs/bundle/release/app-release.aab
      - name: Third-party notices
        run: grep -q "^tailscale.com $(cd core && go list -m -f '{{.Version}}' tailscale.com)\$" app/libs/THIRD_PARTY_NOTICES.txt

  # The app's instrumented tests on an emulator: WebView, the proxy, profiles, the lock and every
  # screen's accessibility checks. On pushes to android until it merges, since GitHub runs
  # schedules only on the default branch, then weekly. API 36: on 37 Espresso 3.7.0 can't start
  # (Android 17 removed the InputManager method it reflects on). 36's image has WebView M133,
  # below Ovenlight's M144 floor, so it gets Google's own WebView from 37's image, as avds.sh
  # gives the mini's AVDs.
  android-emulator:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/android') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@v7
        with:
          go-version-file: android/core/go.mod
          cache-dependency-path: android/core/go.sum
      - name: Gradle wrapper
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c
      - name: SDK packages and the emulators (no-ops when the image has them)
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(sed -n 's/^ovenlight.ndkVersion=//p' gradle.properties)" "platforms;android-37.0" "build-tools;36.0.0" \
            emulator "system-images;android-36;google_apis;x86_64" "system-images;android-37.0;google_apis;x86_64" > /dev/null
      # Made fresh on the runner (the fixed AVD set is the mini's), and booting while the app builds:
      # ci on 5554 for the tests, and webview on 5556 only to hand over its WebView.
      - name: Emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          for avd in ci:android-36:5554 webview:android-37.0:5556; do
            IFS=: read -r name api port <<< "$avd"
            echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n "$name" -k "system-images;$api;google_apis;x86_64" -d pixel_9
            # 4 GB, as the mini's: the web view pool keeps as many pages as it does there.
            nohup "$ANDROID_HOME/emulator/emulator" -avd "$name" -port "$port" -memory 4096 -no-window -no-audio -no-boot-anim -no-metrics -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/$name.log" 2>&1 &
          done
      # The release set of ABIs, which debug builds take too: the runner's emulator is x86_64.
      - name: Core library
        run: ../scripts/build-android-core.sh
      - name: The app and its tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      # Then as the mini's AVDs are (avds.sh): WebView M144 or later, no animations, the PIN 1111,
      # awake and unlocked, since a phone on its lock screen keeps every app from resuming.
      - name: Boot
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          booted() { timeout 600 sh -c "until [ \"\$('$adb' -s $1 shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')\" = 1 ]; do sleep 2; done"; }
          webview() { "$adb" -s emulator-5554 shell dumpsys webviewupdate | sed -n 's/.*Current WebView package (name, version): ([^,]*, \([0-9]*\)\..*/\1/p' | head -1; }
          booted emulator-5556 || { tail -50 "$RUNNER_TEMP/webview.log"; exit 1; }
          "$adb" -s emulator-5556 pull "$("$adb" -s emulator-5556 shell pm path com.google.android.webview | tr -d '\r' | sed -n 's/^package://p' | head -1)" "$RUNNER_TEMP/webview.apk"
          "$adb" -s emulator-5556 emu kill
          booted emulator-5554 || { tail -50 "$RUNNER_TEMP/ci.log"; exit 1; }
          # The package manager may still be settling just after boot.
          for _ in 1 2 3 4 5 6; do "$adb" -s emulator-5554 install -r "$RUNNER_TEMP/webview.apk" && break; sleep 3; done
          for _ in $(seq 30); do [ "$(webview)" -ge 144 ] 2> /dev/null && break; sleep 2; done
          [ "$(webview)" -ge 144 ] 2> /dev/null || { echo "WebView M$(webview)"; exit 1; }
          for k in window_animation_scale transition_animation_scale animator_duration_scale; do "$adb" -s emulator-5554 shell settings put global $k 0; done
          "$adb" -s emulator-5554 shell locksettings set-pin 1111
          "$adb" -s emulator-5554 shell svc power stayon true
          "$adb" -s emulator-5554 shell settings put system screen_off_timeout 2147483647
          # grep -c reads to the end: an early exit would fail the pipe under pipefail.
          locked() { [ "$("$adb" -s emulator-5554 shell dumpsys window policy | grep -A1 KeyguardStateMonitor | grep -c 'mIsShowing=true')" != 0 ]; }
          "$adb" -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          for _ in 1 2 3 4 5; do
            locked || break
            "$adb" -s emulator-5554 shell wm dismiss-keyguard || true
            sleep 1
            "$adb" -s emulator-5554 shell input text 1111
            "$adb" -s emulator-5554 shell input keyevent 66
            sleep 2
          done
          ! locked || { echo "the emulator stayed on its lock screen"; exit 1; }
      - name: Instrumented tests
        run: ANDROID_SERIAL=emulator-5554 ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-reports
          path: android/app/build/reports/androidTests/connected/

  # The docs as the site renders them: a link or #anchor in docs/ that goes nowhere fails.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts/sitedocs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: scripts/sitedocs/go.mod
          cache-dependency-path: scripts/sitedocs/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go run .
