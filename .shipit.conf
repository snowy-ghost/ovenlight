SCHEME=Ovenlight
XCODEPROJ=Ovenlight.xcodeproj
BUNDLE_ID=com.snowyghost.ovenlight
TEAM_ID=A84T8TANK8
TEST_DESTINATION="platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5"
# TailscaleKit.xcframework is built, not committed: build it (cached) before testing and archiving.
TEST_CMD='scripts/build-tailscalekit.sh && xcodebuild test -project Ovenlight.xcodeproj -scheme Ovenlight -destination "$TEST_DESTINATION"'
# Archive only a clean commit that is on GitHub, and log which one.
PRE_ARCHIVE_CMD='git fetch -q origin || exit
  [ -z "$(git status --porcelain)" ] || { echo "the tree has uncommitted changes"; exit 1; }
  [ -n "$(git branch -r --contains HEAD)" ] || { echo "HEAD is on no origin branch; push it"; exit 1; }
  echo "archiving $(git rev-parse HEAD)"
  scripts/build-tailscalekit.sh'
# Export compliance: Ovenlight ships WireGuard (standard algorithms, not Apple's OS crypto).
# Answered in App Store Connect as "standard algorithms, not distributed in France", which
# ASC records as usesNonExemptEncryption=false, so ship-testflight stamps
# ITSAppUsesNonExemptEncryption=NO and TestFlight stops asking per build.
# Revisit before any App Store release in France (French declaration needed).
# The shipped app must embed TailscaleKit with its license notices and privacy manifest,
# carry its own privacy manifest, and be signed to open invite links (applinks).
VERIFY_CMD='test -f "$SHIPIT_APP/Frameworks/TailscaleKit.framework/TailscaleKit" &&
  test -s "$SHIPIT_APP/Frameworks/TailscaleKit.framework/THIRD_PARTY_NOTICES.txt" &&
  test -f "$SHIPIT_APP/Frameworks/TailscaleKit.framework/PrivacyInfo.xcprivacy" &&
  test -f "$SHIPIT_APP/PrivacyInfo.xcprivacy" &&
  codesign -d --entitlements - "$SHIPIT_APP" | grep -qF applinks:ovenlight.app'
