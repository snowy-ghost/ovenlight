android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# Lint and R8 need more than Gradle's default heap, here and in CI.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx2g

# The SDK levels (the plan's decision 4). targetSdk is set explicitly, since AGP would
# otherwise copy compileSdk into it. -PtargetSdk=37 tries next year's level.
ovenlight.compileSdk=37
ovenlight.targetSdk=36
ovenlight.minSdk=29

ovenlight.buildTools=36.0.0

# One NDK, read by Gradle and by scripts/build-android-core.sh.
ovenlight.ndkVersion=30.0.16248370
