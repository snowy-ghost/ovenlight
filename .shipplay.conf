# ship-play (in the dotfiles) uploads the Android app's release bundle to Play's internal
# testing, with the credentials named ovenlight.
GRADLE_DIR=android
NAME=ovenlight
TEST_CMD='cd android && ./gradlew --console=plain --no-daemon :app:lintRelease :app:testDebugUnitTest'
VERIFY_CMD='android/scripts/verify-bundle.sh "$SHIPPLAY_AAB"'
BUNDLETOOL=android/scripts/bundletool.sh
